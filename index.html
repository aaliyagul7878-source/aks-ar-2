<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AKS (عکس) — AR Poster</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // 1. Makes the black background of sand-layer.mp4 transparent
    AFRAME.registerComponent('front-hologram', {
      init: function () {
        const videoEl = document.querySelector('#sandVid');
        const tex = new THREE.VideoTexture(videoEl);
        tex.colorSpace = THREE.SRGBColorSpace;

        const applyShader = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.material = new THREE.ShaderMaterial({
            uniforms: { uMap: { value: tex } },
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D uMap;
              varying vec2 vUv;
              void main() {
                vec4 col = texture2D(uMap, vUv);
                float luma = max(col.r, max(col.g, col.b));
                float alpha = smoothstep(0.06, 0.28, luma);
                vec3 warmGold = col.rgb * vec3(0.95, 0.84, 0.65);
                gl_FragColor = vec4(warmGold, alpha);
              }
            `
          });
        };

        if (this.el.getObject3D('mesh')) {
          applyShader();
        } else {
          this.el.addEventListener('object3dset', applyShader);
        }
      }
    });

    // 2. Smooths position and damps extreme 3D angle skewing on dark targets
    AFRAME.registerComponent('stabilize-poster', {
      schema: {
        target: { type: 'selector' }
      },
      init: function () {
        this.rawPos = new THREE.Vector3();
        this.rawQuat = new THREE.Quaternion();
        this.rawScale = new THREE.Vector3();
        this.euler = new THREE.Euler(0, 0, 0, 'YXZ');
        this.targetQuat = new THREE.Quaternion();
        this.isTracking = false;

        this.data.target.addEventListener('targetFound', () => {
          this.isTracking = true;
          this.el.object3D.visible = true;
        });
        this.data.target.addEventListener('targetLost', () => {
          this.isTracking = false;
          this.el.object3D.visible = false;
        });
      },
      tick: function () {
        if (!this.isTracking) return;
        const targetMat = this.data.target.object3D.matrix;
        targetMat.decompose(this.rawPos, this.rawQuat, this.rawScale);

        // Damp out erratic pitch/yaw spikes so the poster doesn't warp sideways
        this.euler.setFromQuaternion(this.rawQuat, 'YXZ');
        this.euler.x *= 0.25;
        this.euler.y *= 0.25;
        this.euler.z *= 0.6;
        this.targetQuat.setFromEuler(this.euler);

        // Smoothly interpolate position, rotation, and scale
        this.el.object3D.position.lerp(this.rawPos, 0.3);
        this.el.object3D.quaternion.slerp(this.targetQuat, 0.25);
        this.el.object3D.scale.lerp(this.rawScale, 0.3);
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    .a-enter-vr, .a-orientation-modal, .a-enter-ar { display: none !important; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 10;"
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="skyVid" src="./sky-layer.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="sandVid" src="./sand-layer.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Raw MindAR tracker -->
    <a-entity id="target" mindar-image-target="targetIndex: 0"></a-entity>

    <!-- Stabilized visual container -->
    <a-entity visible="false" stabilize-poster="target: #target">

      <!-- 1. SOLID BLACK COVER PLATE -->
      <a-plane
        color="#040302"
        position="0 0 0.0"
        width="1.0"
        height="1.414"
        material="shader: flat; opacity: 1.0">
      </a-plane>

      <!-- 2. SINGLE SKY VIDEO LAYER -->
      <a-video
        src="#skyVid"
        position="0 0 0.01"
        width="1.0"
        height="1.414"
        material="shader: flat">
      </a-video>

      <!-- 3. SINGLE SAND + ALIF + AKS LOGO LAYER -->
      <a-video
        src="#sandVid"
        position="0 0 0.025"
        width="1.0"
        height="1.414"
        front-hologram>
      </a-video>

    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector('#target');
    const vids = [
      document.querySelector('#skyVid'),
      document.querySelector('#sandVid')
    ];
    target.addEventListener('targetFound', () => {
      vids.forEach(v => v.play());
    });
    target.addEventListener('targetLost', () => {
      vids.forEach(v => v.pause());
    });
  </script>
</body>
</html>
