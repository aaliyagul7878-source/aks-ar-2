<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AKS (عکس) — 4D AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Cleanly removes the black video background WITHOUT blowing out the gold color
    // and splits the bottom sand (z = 0.03) from the floating Alif/AKS logo (z = 0.20) with ZERO double vision
    AFRAME.registerComponent('clean-hologram', {
      schema: {
        mode: { type: 'string', default: 'full' }, // 'sky', 'sand', or 'logo'
        brightness: { type: 'number', default: 0.85 }
      },
      init: function () {
        this.el.addEventListener('loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh || !mesh.material) return;
          const tex = mesh.material.map;
          const mode = this.data.mode;
          const bright = this.data.brightness;

          mesh.material = new THREE.ShaderMaterial({
            uniforms: {
              uMap: { value: tex },
              uBright: { value: bright }
            },
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D uMap;
              uniform float uBright;
              varying vec2 vUv;
              void main() {
                vec4 col = texture2D(uMap, vUv);
                // Soft vignette on edges so no harsh rectangular box ever shows
                vec2 d = abs(vUv - vec2(0.5)) * 2.0;
                float edgeFade = (1.0 - smoothstep(0.82, 1.0, d.x)) * (1.0 - smoothstep(0.85, 1.0, d.y));

                // Luma key: black becomes 100% transparent, gold stays rich bronze-gold
                float luma = max(col.r, max(col.g, col.b));
                float alpha = smoothstep(0.05, 0.35, luma) * edgeFade;

                // Region mask so sand and logo sit at different 3D depths without duplicating
                float regionMask = 1.0;
                ${mode === 'sand' ? 'regionMask = 1.0 - smoothstep(0.34, 0.46, vUv.y);' : ''}
                ${mode === 'logo' ? 'regionMask = smoothstep(0.32, 0.44, vUv.y);' : ''}

                // Warm bronze-gold tone control (prevents neon yellow blowout)
                vec3 bronzeGold = col.rgb * vec3(1.0, 0.88, 0.68) * uBright;
                gl_FragColor = vec4(bronzeGold, alpha * regionMask);
              }
            `
          });
        });
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    /* Hides the white VR button in the bottom-right corner */
    .a-enter-vr, .a-orientation-modal { display: none !important; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="skyVid" src="./sky-layer.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="sandVid" src="./sand-layer.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- 1. DEEP SKY LAYER (Single crisp copy inside the poster at z = -0.10) -->
      <a-video
        src="#skyVid"
        position="0 0 -0.10"
        width="1.05"
        height="1.48"
        clean-hologram="mode: sky; brightness: 0.95">
      </a-video>

      <!-- 2. SAND HORIZON LAYER (Sits on the poster surface at z = 0.03) -->
      <a-video
        src="#sandVid"
        position="0 0 0.03"
        width="1.06"
        height="1.50"
        clean-hologram="mode: sand; brightness: 0.80">
      </a-video>

      <!-- 3. FLOATING 4D ALIF & AKS LOGO (Single crisp copy floating out in mid-air at z = 0.20) -->
      <a-video
        src="#sandVid"
        position="0 0 0.20"
        width="1.10"
        height="1.55"
        clean-hologram="mode: logo; brightness: 0.85">
      </a-video>

    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector('#target');
    const vids = [
      document.querySelector('#skyVid'),
      document.querySelector('#sandVid')
    ];
    target.addEventListener('targetFound', () => {
      vids.forEach(v => {
        v.currentTime = 0;
        v.play();
      });
    });
  </script>
</body>
</html>
