<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AKS (عکس) — 4D Multi-Layer AR</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Removes black background so the sky, sand, Alif, and logo float in 3D space
    AFRAME.registerComponent('additive-layer', {
      schema: { opacity: { type: 'number', default: 1.0 } },
      init: function () {
        this.el.addEventListener('loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (mesh && mesh.material) {
            mesh.material.blending = THREE.AdditiveBlending;
            mesh.material.transparent = true;
            mesh.material.opacity = this.data.opacity;
            mesh.material.depthWrite = false;
            mesh.material.side = THREE.DoubleSide;
          }
        });
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001;"
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="skyVid" src="./sky-layer.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="sandVid" src="./sand-layer.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- PLANE 1: Dark Backing Box Deep Inside Poster (z = -0.30) -->
      <a-plane color="#050403" position="0 0 -0.30" width="1.12" height="1.58" material="shader: flat; opacity: 0.95"></a-plane>

      <!-- PLANE 2: Deepest Urdu Star-Trail Tunnel (z = -0.24) -->
      <a-video
        src="#skyVid"
        position="0 0.03 -0.24"
        width="0.96"
        height="1.36"
        additive-layer="opacity: 0.65">
      </a-video>

      <!-- PLANE 3: Main Rotating Urdu Star-Trail Sky (z = -0.12) -->
      <a-video
        src="#skyVid"
        position="0 0 -0.12"
        width="1.15"
        height="1.62"
        additive-layer="opacity: 0.95"
        animation="property: position; dir: alternate; dur: 3200; easing: easeInOutSine; loop: true; from: 0 0 -0.14; to: 0 0 -0.08">
      </a-video>

      <!-- PLANE 4: Base Sand Dunes on the Poster Surface (z = 0.04) -->
      <a-video
        src="#sandVid"
        position="0 0 0.04"
        width="1.12"
        height="1.58"
        additive-layer="opacity: 0.90">
      </a-video>

      <!-- PLANE 5: Main 4D Pop-Out — Rising Sand, Alif & AKS Logo (z = 0.22) -->
      <a-video
        src="#sandVid"
        position="0 0 0.22"
        width="1.25"
        height="1.76"
        additive-layer="opacity: 1.0"
        animation="property: position; dir: alternate; dur: 2500; easing: easeInOutQuad; loop: true; from: 0 -0.01 0.18; to: 0 0.02 0.26">
      </a-video>

      <!-- PLANE 6: Closest 4D Foreground Hologram Halo (z = 0.36) -->
      <a-video
        src="#sandVid"
        position="0 0 0.36"
        width="1.36"
        height="1.92"
        additive-layer="opacity: 0.55"
        animation="property: position; dir: alternate; dur: 2500; easing: easeInOutQuad; loop: true; from: 0 0.01 0.32; to: 0 -0.01 0.40">
      </a-video>
    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector('#target');
    const vids = [
      document.querySelector('#skyVid'),
      document.querySelector('#sandVid')
    ];
    target.addEventListener('targetFound', () => {
      vids.forEach(v => {
        v.currentTime = 0;
        v.play();
      });
    });
  </script>
</body>
</html>
