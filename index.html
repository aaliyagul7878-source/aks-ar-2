<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AKS (عکس) — AR Poster</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Makes only the black background of sand-layer.mp4 transparent 
    // so ONE single sand + AKS layer floats cleanly in front of ONE single sky layer
    AFRAME.registerComponent('front-hologram', {
      init: function () {
        this.el.addEventListener('loaded', () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh || !mesh.material) return;
          const tex = mesh.material.map;
          mesh.material = new THREE.ShaderMaterial({
            uniforms: { uMap: { value: tex } },
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D uMap;
              varying vec2 vUv;
              void main() {
                vec4 col = texture2D(uMap, vUv);
                float luma = max(col.r, max(col.g, col.b));
                float alpha = smoothstep(0.06, 0.28, luma);
                vec3 warmGold = col.rgb * vec3(0.95, 0.84, 0.65);
                gl_FragColor = vec4(warmGold, alpha);
              }
            `
          });
        });
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    .a-enter-vr, .a-orientation-modal, .a-enter-ar { display: none !important; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.001; filterBeta: 0.02; warmupTolerance: 3; missTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="skyVid" src="./sky-layer.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="sandVid" src="./sand-layer.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- 1. SOLID BLACK COVER PLATE (Hides the static poster underneath so it NEVER doubles) -->
      <a-plane
        color="#040302"
        position="0 0 0.0"
        width="1.02"
        height="1.44"
        material="shader: flat; opacity: 1.0">
      </a-plane>

      <!-- 2. SINGLE SKY VIDEO LAYER (Sits on the back plane at z = 0.01) -->
      <a-video
        src="#skyVid"
        position="0 0 0.01"
        width="1.0"
        height="1.414"
        material="shader: flat">
      </a-video>

      <!-- 3. SINGLE SAND + ALIF + AKS LOGO LAYER (Floats forward in 3D space at z = 0.08) -->
      <a-video
        src="#sandVid"
        position="0 0 0.08"
        width="1.04"
        height="1.47"
        front-hologram>
      </a-video>

    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector('#target');
    const vids = [
      document.querySelector('#skyVid'),
      document.querySelector('#sandVid')
    ];
    target.addEventListener('targetFound', () => {
      vids.forEach(v => {
        v.currentTime = 0;
        v.play();
      });
    });
    target.addEventListener('targetLost', () => {
      vids.forEach(v => v.pause());
    });
  </script>
</body>
</html>
