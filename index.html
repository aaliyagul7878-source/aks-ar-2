<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AKS (عکس) — AR Poster</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    AFRAME.registerComponent('front-hologram', {
      schema: {
        opacityBoost: { type: 'number', default: 1.0 }
      },
      init: function () {
        const videoEl = document.querySelector('#sandVid');
        const tex = new THREE.VideoTexture(videoEl);
        tex.colorSpace = THREE.SRGBColorSpace;
        const boost = this.data.opacityBoost;

        const applyShader = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.material = new THREE.ShaderMaterial({
            uniforms: {
              uMap: { value: tex },
              uBoost: { value: boost }
            },
            transparent: true,
            depthWrite: false,
            side: THREE.DoubleSide,
            vertexShader: `
              varying vec2 vUv;
              void main() {
                vUv = uv;
                gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
              }
            `,
            fragmentShader: `
              uniform sampler2D uMap;
              uniform float uBoost;
              varying vec2 vUv;
              void main() {
                vec4 col = texture2D(uMap, vUv);
                float luma = max(col.r, max(col.g, col.b));
                float alpha = smoothstep(0.06, 0.25, luma) * uBoost;
                vec3 warmGold = col.rgb * vec3(0.98, 0.86, 0.65);
                gl_FragColor = vec4(warmGold, alpha);
              }
            `
          });
        };

        if (this.el.getObject3D('mesh')) {
          applyShader();
        } else {
          this.el.addEventListener('object3dset', applyShader);
        }
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    .a-enter-vr, .a-orientation-modal, .a-enter-ar { display: none !important; }
  </style>
</head>
<body>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 15;"
    color-space="sRGB"
    renderer="colorManagement: true, alpha: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <video id="skyVid" src="./sky-layer.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
      <video id="sandVid" src="./sand-layer.mp4" loop muted playsinline webkit-playsinline crossorigin="anonymous"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Directly anchored inside MindAR target so it NEVER floats off to the side -->
    <a-entity id="target" mindar-image-target="targetIndex: 0">

      <!-- 1. BLACK BASE PLATE (Pinned directly to poster surface z = 0) -->
      <a-plane
        color="#040302"
        position="0 0 0.0"
        width="1.0"
        height="1.414"
        material="shader: flat; opacity: 1.0">
      </a-plane>

      <!-- 2. SKY VIDEO LAYER (Slightly above base at z = 0.01) -->
      <a-video
        src="#skyVid"
        position="0 0 0.01"
        width="1.0"
        height="1.414"
        material="shader: flat">
      </a-video>

      <!-- 3. MID 3D HOLOGRAM LAYER (Floats out at z = 0.08) -->
      <a-plane
        position="0 0 0.08"
        width="1.0"
        height="1.414"
        front-hologram="opacityBoost: 0.85">
      </a-plane>

      <!-- 4. FRONT 4D POP-OUT LAYER (Floats far forward at z = 0.16 for parallax depth) -->
      <a-plane
        position="0 0 0.16"
        width="1.02"
        height="1.44"
        front-hologram="opacityBoost: 1.0">
      </a-plane>

    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector('#target');
    const vids = [
      document.querySelector('#skyVid'),
      document.querySelector('#sandVid')
    ];
    target.addEventListener('targetFound', () => {
      vids.forEach(v => v.play());
    });
    target.addEventListener('targetLost', () => {
      vids.forEach(v => v.pause());
    });
  </script>
</body>
</html>
